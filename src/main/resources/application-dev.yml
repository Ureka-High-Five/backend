spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    mongodb:
      uri: mongodb://${MONGO_DB_HOST}:${MONGO_DB_PORT}/${MONGO_DB_NAME}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      ssl:
        enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    listener:
      simple:
        acknowledge-mode: manual
    mq:
      queue:
        user-action: user-action-queue

jwt:
  secret: ${JWT_SECRET}
  accessToken-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refreshToken-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

kakao:
  client-id: ${OAUTH_CLIENT_ID}
  client-secret: ${OAUTH_CLIENT_SECRET}
  redirect-uri: ${OAUTH_FE_REDIRECT_URI}

cloud:
  aws:
    s3:
      bucket: dev-leadme
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${S3_ACCESS_KEY}
      access-secret-key: ${S3_SECRET_ACCESS_KEY}

fastapi:
  host: ${RECOMMEND_SERVER_URL}
  port: ${RECOMMEND_SERVER_PORT}

queue:
  name: recommendation.weight.update

management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true