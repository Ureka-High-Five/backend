version: '3.8'

services:
  db:
    image: mysql:8
    container_name: local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: user
      MYSQL_DATABASE: highfive
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - local-net

  redis:
    image: redis:6
    container_name: local-redis
    ports:
      - "6379:6379"
    networks:
      - local-net

  mongo:
    image: mongo:6.0
    container_name: local-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: localdb
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - mongo-data:/data/db
    networks:
      - local-net

volumes:
  db-data:
  mongo-data:

networks:
  local-net: